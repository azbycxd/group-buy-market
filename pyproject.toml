[project]
name = "group-buy-agent"
version = "0.1.0"
description = "Minimal LangChain order facts agent"
requires-python = ">=3.11"
dependencies = [
    "langchain==1.4.2",
    "langgraph==1.2.12",
    "langgraph-checkpoint-sqlite==3.1.1",
    "langchain-openai==1.6.6",
    "aiosqlite==0.22.1",
    "PyJWT==2.10.1",
    "fastapi",
    "uvicorn",
    "httpx",
    "python-dotenv",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["action_ledger", "agent", "agent_middleware", "api", "cli", "confirmation_workflow", "evidence", "outcome", "reconciler", "requirement_tracker", "session_locks", "session_ownership", "understanding"]
packages = ["fake_java", "tools"]

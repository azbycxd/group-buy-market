[project]
name = "group-buy-agent-s1"
version = "0.1.0"
description = "Minimal LangChain order facts agent"
requires-python = ">=3.11"
dependencies = [
    "langchain",
    "langgraph",
    "langchain-openai",
    "fastapi",
    "uvicorn",
    "httpx",
    "python-dotenv",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["agent", "cli"]
packages = ["fake_java", "tools"]

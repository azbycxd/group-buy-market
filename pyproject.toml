[project]
name = "group-buy-agent"
version = "0.1.0"
description = "Minimal LangChain order facts agent"
requires-python = ">=3.11"
dependencies = [
    "langchain==1.4.2",
    "langgraph==1.2.12",
    "langchain-openai==1.6.6",
    "fastapi",
    "uvicorn",
    "httpx",
    "python-dotenv",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["agent", "agent_middleware", "cli", "evidence", "outcome", "requirement_tracker", "understanding"]
packages = ["fake_java", "tools"]
